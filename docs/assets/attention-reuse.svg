<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494" role="img" aria-labelledby="ar-title ar-desc">
  <title id="ar-title">One attention core, seven compositions</title>
  <desc id="ar-desc">Seven Hopper attention compositions link the same unchanged core package. Each row swaps only small stages around it: a 28-line mask for sliding window, a 29-line score callee for softcap, a block load and mask for Phi-3 block-sparse, a selected-block load and a partial epilogue for MiniMax-M3 sparse attention, and a context-parallel load plus a communication owner's KV-gather warps for multi-GPU attention.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .head { font-size: 15px; font-weight: 600; fill: #59636e; letter-spacing: 0.02em; }
      .name { font-size: 16.5px; font-weight: 600; }
      .work { font-size: 14px; fill: #59636e; }
      .pkg { font-size: 14.5px; }
      .lines { font-size: 12.5px; fill: #59636e; }
      .legend { font-size: 14px; fill: #59636e; }
      .base { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
      .new { fill: #e8effd; stroke: #2563eb; stroke-width: 1.6; }
      .comm { fill: #f1eafd; stroke: #7c3aed; stroke-width: 1.6; }
      .core { fill: #e6f6f4; stroke: #0f9488; stroke-width: 2; }
      .coretext { fill: #0b6b62; font-weight: 700; font-size: 16px; }
      .coresub { fill: #0b6b62; font-size: 13px; }
      .newtext { fill: #1d4ed8; }
      .commtext { fill: #6d28d9; }
      .rule { stroke: #d1d9e0; stroke-width: 1; }
      @media (prefers-color-scheme: dark) {
        text { fill: #e6edf3; }
        .head, .work, .lines, .legend { fill: #9198a1; }
        .base { fill: #161b22; stroke: #3d444d; }
        .new { fill: #102341; stroke: #60a5fa; }
        .comm { fill: #221a3d; stroke: #a78bfa; }
        .core { fill: #0f2a2a; stroke: #2dd4bf; }
        .coretext, .coresub { fill: #5eead4; }
        .newtext { fill: #93c5fd; }
        .commtext { fill: #c4b5fd; }
        .rule { stroke: #3d444d; }
      }
    </style>
  </defs>

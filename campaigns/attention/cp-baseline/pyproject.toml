[project]
name = "pipelink-attention-cp-baseline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.14.0+cu130",
  "nvidia-cudnn-cu13==9.24.0.43",
  "nvidia-cudnn-frontend==1.30.0",
  "transformer-engine[core-cu13]==2.20.2",
  "einops==0.8.2",
  "numpy==2.4.6",
  "packaging==26.3",
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "ninja==1.13.2",
  "pybind11",
  "onnxscript",
  "onnx",
  "pydantic",
  "nvdlfw-inspect",
  "pytest",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

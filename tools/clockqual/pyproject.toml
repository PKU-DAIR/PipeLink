[project]
name = "pipelink-clockqual"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.14.0+cu130", "nvidia-ml-py==13.580.82"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
